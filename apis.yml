aid: plainid
name: PlainID
description: >-
  PlainID is an enterprise authorization company whose Policy-Based Access
  Control (PBAC) platform, "The Authorization Platform," controls what identities
  (human and AI agent) can access, do, and expose across data, APIs, applications,
  and AI systems. The platform centralizes policy authoring and externalizes
  runtime access decisions through a Policy Decision Point (PDP), Policy
  Information Points (PIP), and Policy Authorization Agents. PlainID exposes three
  public REST API families: Runtime Authorization APIs (permit/deny decisions,
  policy resolution, user access tokens, PDP cache invalidation), Management APIs
  (policy, asset-template, application, mapper, and identity-template CRUD plus
  orchestration and SaaS-vendor management), and Administration APIs (audit
  events, API client credentials, platform reports). PlainID is backed by Insight
  Partners.
